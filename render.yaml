# Render Blueprint. In the Render dashboard: New > Blueprint, then choose this repository.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: cards-against-decency
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    # Do not set NODE_ENV here: the build needs the dev dependencies (Tailwind, TypeScript).
    # "npm start" sets NODE_ENV=production for the server.
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Render's traffic passes Cloudflare, which sets CF-Connecting-IP to the player's
      # real address and blocks requests that try to fake it (checked 2026-11-17).
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      # Fallback when the header is missing: 3 proxy entries in X-Forwarded-For (checked 2026-11-17).
      - key: TRUST_PROXY
        value: "3"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # Open games that one IP address can host at the same time.
      - key: HOSTED_GAMES_PER_IP
        value: "3"
      # Secret that seals players' blocks (32 bytes, base64). Keep it the same, or all blocks stop working.
      - key: BLOCK_KEY
        generateValue: true
      # Player feedback goes to the "Player feedback" database in Notion. Set both values in the
      # Render dashboard: they are secrets. Without them, reports go only to the server log.
      - key: NOTION_FEEDBACK_TOKEN
        sync: false
      - key: NOTION_FEEDBACK_DATABASE_ID
        sync: false
